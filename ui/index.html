<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leenax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">L</div>
            <div>
                <h1>Leenax</h1>
                <p>AI Assistant</p>
            </div>
        </header>

        <main id="chat">
            <div class="message leenax">
                <div class="bubble">Hello! I'm Leenax. 👋</div>
            </div>
        </main>

        <form id="chat-form">
            <input
                id="message-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
            >
            <button type="submit">➤</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
